name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          extensions: mbstring
          coverage: none
      - name: Validate composer files
        run: composer validate --no-check-publish
      - name: Run unit tests
        run: composer test
